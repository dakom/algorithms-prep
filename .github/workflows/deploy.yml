# Deploys the static site to GitHub Pages on every push to main.
# Repo settings → Pages → Source must be set to "GitHub Actions" (one-time).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check all scripts
        run: for f in js/*.js js/content/*.js tools/*.js; do node --check "$f"; done
      - name: Verify exercises and widgets
        run: node tools/selfcheck.js

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build version
        run: printf "window.APP_VERSION = '%s (%s)';\n" "${GITHUB_SHA::7}" "$(date -u +%Y-%m-%dT%H:%MZ)" > js/version.js
      # Rewrite index.html asset URLs to js/foo.js?v=<content hash> so browsers
      # pick up changed files as soon as index.html revalidates (≤10 min on
      # Pages), while unchanged files keep their URL and stay cached.
      - name: Cache-bust asset URLs
        run: |
          grep -oE '"(js|css)/[^"?]+"' index.html | tr -d '"' | sort -u | while read -r f; do
            h=$(md5sum "$f" | cut -c1-8)
            sed -i "s|\"$f\"|\"$f?v=$h\"|g" index.html
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
