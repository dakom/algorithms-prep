<!DOCTYPE html>
<html lang="en" data-app-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algo Prep — pattern-recognition coding interview training</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="header-row">
        <div class="logo" id="home-btn" title="Dashboard">⬡ Algo Prep</div>
        <button id="theme-btn" title="Toggle light/dark theme">☾ Dark</button>
      </div>
      <div class="logo-sub">Recognize the pattern · explain · implement · test</div>
      <div class="overall-progress">
        <div class="overall-progress-bar"><div id="overall-fill"></div></div>
        <div id="overall-label">0% complete</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-footer">
      <span class="dim">← → keys navigate</span>
      <button id="reset-btn" title="Reset all progress">Reset progress</button>
    </div>
  </aside>
  <button id="sidebar-toggle" aria-label="Toggle navigation">☰</button>
  <main id="main">
    <div id="content"></div>
    <div id="pager">
      <button id="prev-btn">← Previous</button>
      <button id="next-btn" class="primary">Next →</button>
    </div>
  </main>
</div>
<script src="js/highlight.js"></script>

</html>
